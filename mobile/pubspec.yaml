name: meetpu
description: Meetpu field app for flood and cyclone damage reporting (citizen and staff roles).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  geolocator: ^14.0.0
  connectivity_plus: ^7.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
